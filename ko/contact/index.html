<body data-lang="ko" data-page="contact" class="brand-v5">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a><div class="scroll-progress" aria-hidden="true"><span></span></div>
  <header class="site-header"><div class="nav-shell"><a class="brand" href="../index.html" aria-label="Root Kernel 홈"><img class="brand-logo" src="../../assets/images/rootkernel-wide-logo-light.svg" alt="" width="226" height="25"></a><button class="nav-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">Menu</button><nav class="site-nav" id="primary-nav" aria-label="Primary navigation"><a href="../ai-spark/index.html">AI-SPARK</a><a href="../ai-harness/index.html">AI Harness</a><a href="../ai-agent/index.html">AI Agent</a><a class="active" href="index.html">Contact</a></nav><div class="lang-switch" aria-label="언어 선택"><a class="active" href="index.html" hreflang="ko">KO</a><span aria-hidden="true">/</span><a href="../../en/contact/index.html" hreflang="en">EN</a></div></div></header>

  <main id="main">
    <section class="contact-v5-wrap">
      <div class="contact-v5-intro reveal">
        <p class="rk-kicker">Technical Conversation</p>
        <h1>AI의 가능성을<br>운영 가능한 구조로</h1>
        <p class="rk-hero-lead">해결할 과제와 AI가 담당할 일, 사람이 승인할 지점을 알려주세요.</p>
        <p>아는 범위만으로도 됩니다. 주제는 아래에서 고르세요.</p>
        <div class="contact-v5-direct"><span>이메일 문의</span><a href="mailto:contact@rootkernel.xyz">contact@rootkernel.xyz</a></div>
      </div>

      <section class="contact-v5-form-card reveal" aria-labelledby="contact-form-title">
        <div class="contact-v5-form-head"><p class="rk-kicker">Project Inquiry</p><h2 id="contact-form-title">프로젝트 문의</h2><p>과제, 적용 환경, 기대 결과만 적어주셔도 됩니다.</p></div>
        <form action="#" class="contact-form-v3 contact-form-v5" data-firestore-contact method="post">
          <fieldset class="topic-picker contact-topic-picker">
            <legend class="topic-picker-label">문의 주제</legend>
            <div class="topic-options-v3" aria-label="문의 주제">
              <label class="topic-option"><input name="topic" required type="radio" value="AI-SPARK"><span class="topic-option-copy"><strong>AI-SPARK</strong><small>Spec-first 서버 개발과 검증·승인 구조</small></span></label>
              <label class="topic-option"><input name="topic" required type="radio" value="AI Harness"><span class="topic-option-copy"><strong>AI Harness</strong><small>AI 작업의 절차·문서·리뷰·테스트 기록</small></span></label>
              <label class="topic-option"><input name="topic" required type="radio" value="AI Agent"><span class="topic-option-copy"><strong>AI Agent</strong><small>Hermes Agent 운영과 ATN 다중 Agent 토론</small></span></label>
              <label class="topic-option"><input name="topic" required type="radio" value="Partnership / Other"><span class="topic-option-copy"><strong>PoC · 파트너십</strong><small>공동 실험·기술 자문·워크숍과 기타 협업</small></span></label>
            </div>
          </fieldset>
          <div class="form-row-v3">
            <label class="field-v3"><span class="field-label">담당자명 <i>필수</i></span><input class="input-v3" name="name" type="text" maxlength="80" autocomplete="name" placeholder="이름" required></label>
            <label class="field-v3"><span class="field-label">업무 이메일 <i>필수</i></span><input class="input-v3" name="email" type="email" maxlength="120" autocomplete="email" placeholder="name@company.com" required></label>
          </div>
          <div class="form-row-v3">
            <label class="field-v3"><span class="field-label">회사·기관 <i>선택</i></span><input class="input-v3" name="organization" type="text" maxlength="120" autocomplete="organization" placeholder="회사·기관 및 부서"></label>
            <label class="field-v3"><span class="field-label">문의 제목 <i>선택</i></span><input class="input-v3" name="subject" type="text" maxlength="160" placeholder="예: AI-SPARK 적용 검토"></label>
          </div>
          <label class="field-v3"><span class="field-label">프로젝트 개요 <i>필수</i></span><textarea class="textarea-v3" name="message" maxlength="4000" placeholder="현재 해결하려는 문제, 적용 대상, 기대 결과, 검토 중인 일정과 협업 범위를 알려주세요. 관련 자료나 예산 범위가 있다면 함께 적어주셔도 됩니다." required></textarea></label>
          <label class="contact-honeypot" aria-hidden="true"><span>Website</span><input name="website" type="text" tabindex="-1" autocomplete="off"></label>
          <label class="consent-row"><input class="consent-checkbox" name="consent" type="checkbox" value="agreed" required><span class="consent-copy">입력한 개인정보와 문의 내용의 보관·이용에 동의합니다. 해당 정보는 문의 확인과 연락을 위해 사용되며, 삭제 요청은 <a href="mailto:contact@rootkernel.xyz">contact@rootkernel.xyz</a>로 보낼 수 있습니다.</span></label>
          <div class="form-footer-v3"><button class="button button-primary button-large" type="submit">프로젝트 문의 보내기</button></div>
          <p class="form-status-v3" data-contact-status role="status" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>
