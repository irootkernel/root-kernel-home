<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | 페이지를 찾을 수 없습니다 | Root Kernel</title>
  <meta name="theme-color" content="#fbf6ed">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/styles.css?v=3.7">
</head>
<body>
  <main class="not-found">
    <div>
      <p class="eyebrow">404</p>
      <section aria-labelledby="not-found-en">
        <h1 id="not-found-en">Page not found</h1>
        <p>The page does not exist or its address may have changed.</p>
      </section>
      <section lang="ko" aria-labelledby="not-found-ko">
        <h2 id="not-found-ko">페이지를 찾을 수 없습니다</h2>
        <p>요청하신 페이지가 없거나 주소가 변경되었습니다.</p>
      </section>
      <div class="not-found-actions">
        <a class="button button-primary" href="/en/">English home</a>
        <a class="button button-secondary" href="/ko/" lang="ko">한국어 홈</a>
      </div>
    </div>
  </main>
</body>
</html>
