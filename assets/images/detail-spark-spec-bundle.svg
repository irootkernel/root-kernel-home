<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-SPARK Spec Bundle revision structure</title>
  <desc id="desc">Interface, State, Binding, Policy, and Config modules connect to one Revision and pass through a shared validation boundary.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#15202b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15202b" flood-opacity=".09"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5-10 5z" fill="#11736b"/>
    </marker>
    <marker id="arrowInput" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <style>
      .label{font:700 42px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#15202b;text-anchor:middle}
      .module{fill:#fffdf8;stroke:#11736b;stroke-width:3}
      .link{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowInput)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fbf6ed"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <path class="link" d="M340 244C382 244 392 340 416 395"/>
  <path class="link" d="M600 238V336"/>
  <path class="link" d="M860 244C818 244 808 340 784 395"/>
  <path class="link" d="M375 654C402 654 403 556 416 505"/>
  <path class="link" d="M825 654C798 654 797 556 784 505"/>

  <g filter="url(#shadow)">
    <rect class="module" x="70" y="154" width="270" height="180" rx="24"/>
    <path d="M135 180h55l18 18h67v58H135z" fill="#11736b" fill-opacity=".09" stroke="#11736b" stroke-width="2"/>
    <text class="label" x="205" y="310">Interface</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="module" x="465" y="58" width="270" height="180" rx="24"/>
    <circle cx="552" cy="118" r="19" fill="#11736b" fill-opacity=".12" stroke="#11736b" stroke-width="3"/>
    <circle cx="648" cy="118" r="19" fill="#11736b" fill-opacity=".12" stroke="#11736b" stroke-width="3"/>
    <path d="M574 118h49" fill="none" stroke="#11736b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowInput)"/>
    <text class="label" x="600" y="198">State</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="module" x="860" y="154" width="270" height="180" rx="24"/>
    <circle cx="940" cy="215" r="24" fill="none" stroke="#11736b" stroke-width="5"/>
    <circle cx="1050" cy="215" r="24" fill="none" stroke="#11736b" stroke-width="5"/>
    <path d="M964 215h62" stroke="#11736b" stroke-width="5"/>
    <text class="label" x="995" y="306">Binding</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="module" x="105" y="564" width="270" height="180" rx="24"/>
    <path d="M240 590l36 13v27c0 27-21 40-36 46-15-6-36-19-36-46v-27z" fill="#11736b" fill-opacity=".1" stroke="#11736b" stroke-width="3"/>
    <path d="M224 631l12 12 22-25" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="240" y="722">Policy</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="module" x="825" y="564" width="270" height="180" rx="24"/>
    <path d="M915 610h90m-90 32h90m-90 32h90" stroke="#11736b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="947" cy="610" r="8" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
    <circle cx="978" cy="642" r="8" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
    <circle cx="936" cy="674" r="8" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
    <text class="label" x="960" y="722">Config</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="340" width="360" height="210" rx="32" fill="#15202b"/>
    <text x="600" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="54" font-weight="800" fill="#fffdf8" text-anchor="middle">Revision</text>
    <path d="M518 510h164" stroke="#11736b" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="785" width="420" height="82" rx="41" fill="#fffdf8" stroke="#ad5428" stroke-width="3"/>
    <circle cx="445" cy="826" r="22" fill="#ad5428"/>
    <path d="M434 826l8 8 16-18" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="616" y="841" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="800" fill="#15202b" text-anchor="middle">Validate</text>
  </g>
  <path d="M600 550v235" fill="none" stroke="#ad5428" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrowTeal)"/>
</svg>
