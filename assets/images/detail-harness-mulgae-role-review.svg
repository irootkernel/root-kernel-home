<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Mulgae forms a role-based AI review team</title>
  <desc id="desc">Security, logic, and maintainability reviewers inspect the same code change from different perspectives and combine their findings into one review.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#15202b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15202b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <style>
      .role{font:850 27px system-ui,-apple-system,"Segoe UI",sans-serif}
      .flow{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fbf6ed"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <text x="600" y="95" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="43" font-weight="850" text-anchor="middle">ROLE-BASED REVIEW TEAM</text>
  <text x="600" y="139" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="800" letter-spacing="2" text-anchor="middle">ONE CHANGE · MANY PERSPECTIVES</text>

  <path class="flow" d="M335 450C390 450 382 260 435 260"/>
  <path class="flow" d="M335 450H435"/>
  <path class="flow" d="M335 450c55 0 47 190 100 190"/>
  <path class="flow" d="M735 260c55 0 62 110 110 110"/>
  <path class="flow" d="M735 450h110"/>
  <path class="flow" d="M735 640c55 0 62-110 110-110"/>

  <g filter="url(#shadow)">
    <rect x="55" y="270" width="280" height="360" rx="32" fill="#15202b"/>
    <circle cx="98" cy="314" r="8" fill="#ad5428"/>
    <circle cx="126" cy="314" r="8" fill="#11736b"/>
    <circle cx="154" cy="314" r="8" fill="#fffdf8" opacity=".5"/>
    <text x="195" y="375" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="35" font-weight="850" text-anchor="middle">SAME</text>
    <text x="195" y="417" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="35" font-weight="850" text-anchor="middle">CHANGE</text>
    <path d="M105 455h180m-180 46h138m-138 46h164m-164 46h105" stroke="#fffdf8" stroke-opacity=".52" stroke-width="10" stroke-linecap="round"/>
    <path d="M105 590h80" stroke="#ad5428" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="180" width="300" height="160" rx="30" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <circle cx="505" cy="260" r="42" fill="#11736b" fill-opacity=".1" stroke="#11736b" stroke-width="4"/>
    <path d="M505 226l27 11v20c0 24-16 37-27 43-11-6-27-19-27-43v-20z" fill="none" stroke="#11736b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M491 260l10 10 19-23" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="role" x="570" y="253" fill="#15202b">SECURITY</text>
    <text x="650" y="286" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="750" text-anchor="middle">RISK VIEW</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="370" width="300" height="160" rx="30" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <circle cx="505" cy="450" r="42" fill="#11736b" fill-opacity=".1" stroke="#11736b" stroke-width="4"/>
    <path d="M480 450l17 17 34-41" fill="none" stroke="#11736b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="role" x="570" y="443" fill="#15202b">LOGIC</text>
    <text x="650" y="476" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="750" text-anchor="middle">BEHAVIOR VIEW</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="560" width="300" height="160" rx="30" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <circle cx="505" cy="640" r="42" fill="#11736b" fill-opacity=".1" stroke="#11736b" stroke-width="4"/>
    <path d="M482 618h46v44h-46zm12 0v-12m22 12v-12m-22 68v-12m22 12v-12" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="565" y="633" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="23" font-weight="850">CODE HEALTH</text>
    <text x="650" y="666" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="750" text-anchor="middle">MAINTAINABILITY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="845" y="255" width="300" height="390" rx="34" fill="#fffdf8" stroke="#ad5428" stroke-width="4"/>
    <text x="995" y="320" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="35" font-weight="850" text-anchor="middle">ONE REVIEW</text>
    <path d="M915 355h126l35 35v190H915z" fill="#11736b" fill-opacity=".07" stroke="#11736b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1041 355v36h35" fill="none" stroke="#11736b" stroke-width="4"/>
    <circle cx="948" cy="430" r="15" fill="#11736b"/>
    <path d="M941 430l6 6 10-13" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M978 430h58" stroke="#11736b" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
    <circle cx="948" cy="480" r="15" fill="#11736b"/>
    <path d="M941 480l6 6 10-13" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M978 480h78" stroke="#11736b" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
    <circle cx="948" cy="530" r="15" fill="#ad5428"/>
    <path d="M941 530l6 6 10-13" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M978 530h68" stroke="#ad5428" stroke-opacity=".72" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
