<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Podway keeps an AI aligned with its goal and current process</title>
  <desc id="desc">A fixed goal guides an FSM path. An AI remains anchored to the current state and resumes there after a session changes.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#15202b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15202b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <style>
      .label{font:800 30px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;text-anchor:middle}
      .small{font:800 24px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.08em;text-anchor:middle}
      .flow{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fbf6ed"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="70" width="420" height="170" rx="36" fill="#15202b"/>
    <circle cx="480" cy="155" r="48" fill="#ad5428"/>
    <path d="M480 119l10 24 26 2-20 17 6 26-22-14-22 14 6-26-20-17 26-2z" fill="#fffdf8"/>
    <text x="635" y="148" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="850" text-anchor="middle">GOAL</text>
    <text x="635" y="190" fill="#fffdf8" opacity=".62" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="23" font-weight="700" text-anchor="middle">STAYS IN SIGHT</text>
  </g>

  <path d="M600 240v105" fill="none" stroke="#ad5428" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="345" r="11" fill="#ad5428"/>

  <g filter="url(#shadow)">
    <rect x="75" y="345" width="1050" height="335" rx="34" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <text x="150" y="407" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="850" letter-spacing="3">FSM</text>
    <path class="flow" d="M250 520H400"/>
    <path class="flow" d="M505 520H643"/>
    <path class="flow" d="M760 520H910"/>
    <g>
      <circle cx="205" cy="520" r="62" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
      <path d="M180 520h50m-25-25v50" stroke="#11736b" stroke-width="6" stroke-linecap="round"/>
      <text class="small" x="205" y="625" fill="#15202b">ORIENT</text>
    </g>
    <g>
      <circle cx="460" cy="520" r="62" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
      <path d="M432 493h56v54h-56zm12 14h32m-32 14h25" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="small" x="460" y="625" fill="#15202b">PLAN</text>
    </g>
    <g>
      <circle cx="715" cy="520" r="74" fill="#15202b" stroke="#ad5428" stroke-width="7"/>
      <circle cx="715" cy="505" r="24" fill="#fffdf8"/>
      <path d="M675 558c11-31 69-31 80 0" fill="none" stroke="#fffdf8" stroke-width="9" stroke-linecap="round"/>
      <rect x="657" y="417" width="116" height="38" rx="19" fill="#ad5428"/>
      <text x="715" y="444" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="850" text-anchor="middle">CURRENT</text>
      <text class="small" x="715" y="625" fill="#15202b">WORK</text>
    </g>
    <g>
      <circle cx="970" cy="520" r="62" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
      <path d="M940 520l19 19 39-47" fill="none" stroke="#11736b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="small" x="970" y="625" fill="#15202b">VERIFY</text>
    </g>
  </g>

  <path class="flow" d="M1020 705c0 105-305 106-305 0c0-35-95-30-95-95c0-18 28-22 55-28" stroke-dasharray="12 14"/>
  <g filter="url(#shadow)">
    <rect x="775" y="725" width="330" height="105" rx="28" fill="#fffdf8" stroke="#ad5428" stroke-width="3"/>
    <path d="M806 760v35m22-35v35" stroke="#ad5428" stroke-width="8" stroke-linecap="round"/>
    <text x="970" y="773" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="25" font-weight="850" text-anchor="middle">SESSION CHANGES</text>
    <text x="970" y="808" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="800" text-anchor="middle">RESUME HERE</text>
  </g>
</svg>
