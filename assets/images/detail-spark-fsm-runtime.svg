<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-SPARK FSM Runtime transition path</title>
  <desc id="desc">A runtime event passes through the current state and version check, transition rule, Guard, Action, new state, change record, and stream publication. Rejected or failed transitions preserve the current state through rejection or rollback.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#15202b" stroke-opacity=".04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#15202b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <marker id="arrowWarm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#ad5428"/>
    </marker>
    <style>
      .card{fill:#fffdf8;stroke:#11736b;stroke-width:3}
      .extension{fill:#fffdf8;stroke:#ad5428;stroke-width:4}
      .flow{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .fail{fill:none;stroke:#ad5428;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:11 12;marker-end:url(#arrowWarm)}
      .label{font:800 43px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#15202b;text-anchor:middle}
      .small{font:800 28px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#657080;text-anchor:middle;letter-spacing:.03em}
      .code{font:800 36px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#15202b;text-anchor:middle}
      .num{font:800 28px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fffdf8;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbf6ed"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="55" y="76" fill="#11736b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="850" letter-spacing="3">DECLARED TRANSITION PATH</text>
  <g>
    <rect x="1025" y="28" width="250" height="54" rx="27" fill="#fffdf8" stroke="#e2d7c7" stroke-width="2"/>
    <circle cx="1060" cy="55" r="10" fill="#11736b"/>
    <text x="1165" y="63" fill="#657080" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="800" text-anchor="middle">RUNTIME CONTROL</text>
    <rect x="1295" y="28" width="250" height="54" rx="27" fill="#fffdf8" stroke="#e2d7c7" stroke-width="2"/>
    <circle cx="1330" cy="55" r="10" fill="#ad5428"/>
    <text x="1435" y="63" fill="#657080" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="800" text-anchor="middle">AI EXTENSION</text>
  </g>

  <path class="flow" d="M350 245H450"/>
  <path class="flow" d="M750 245H850"/>
  <path class="flow" d="M1150 245H1250"/>
  <path class="flow" d="M1400 340V480"/>
  <path class="flow" d="M1250 575H1150"/>
  <path class="flow" d="M850 575H750"/>
  <path class="flow" d="M450 575H350"/>

  <g filter="url(#shadow)">
    <rect class="extension" x="50" y="150" width="300" height="190" rx="26"/>
    <circle cx="200" cy="205" r="27" fill="#ad5428"/><text class="num" x="200" y="214">01</text>
    <text class="code" x="200" y="285">runtime_event</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="450" y="150" width="300" height="190" rx="26"/>
    <circle cx="600" cy="205" r="27" fill="#11736b"/><text class="num" x="600" y="214">02</text>
    <text class="label" x="600" y="273">Current State</text>
    <text class="small" x="600" y="310">+ VERSION</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="850" y="150" width="300" height="190" rx="26"/>
    <circle cx="1000" cy="205" r="27" fill="#11736b"/><text class="num" x="1000" y="214">03</text>
    <text class="label" x="1000" y="273">Transition</text>
    <text class="small" x="1000" y="310">RULE</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="extension" x="1250" y="150" width="300" height="190" rx="26"/>
    <circle cx="1400" cy="205" r="27" fill="#ad5428"/><text class="num" x="1400" y="214">04</text>
    <text class="label" x="1400" y="287">Guard</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="extension" x="1250" y="480" width="300" height="190" rx="26"/>
    <circle cx="1400" cy="535" r="27" fill="#ad5428"/><text class="num" x="1400" y="544">05</text>
    <text class="label" x="1400" y="617">Action</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="850" y="480" width="300" height="190" rx="26" fill="#15202b" stroke="#15202b" stroke-width="3"/>
    <circle cx="1000" cy="535" r="27" fill="#11736b"/><text class="num" x="1000" y="544">06</text>
    <text x="1000" y="603" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="43" font-weight="800" text-anchor="middle">New State</text>
    <text x="1000" y="640" fill="#fffdf8" opacity=".62" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="27" font-weight="800" text-anchor="middle">COMMITTED</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="450" y="480" width="300" height="190" rx="26"/>
    <circle cx="600" cy="535" r="27" fill="#11736b"/><text class="num" x="600" y="544">07</text>
    <text class="label" x="600" y="603">Change</text>
    <text class="small" x="600" y="640">RECORD</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="50" y="480" width="300" height="190" rx="26"/>
    <circle cx="200" cy="535" r="27" fill="#11736b"/><text class="num" x="200" y="544">08</text>
    <text class="label" x="200" y="617">Stream</text>
  </g>

  <path class="fail" d="M1512 340V733H1370"/>
  <g filter="url(#shadow)">
    <rect x="270" y="735" width="1100" height="105" rx="28" fill="#fffdf8" stroke="#ad5428" stroke-width="4"/>
    <circle cx="350" cy="787" r="28" fill="#ad5428"/>
    <path d="M350 768v25m0 17v2" stroke="#fffdf8" stroke-width="7" stroke-linecap="round"/>
    <text x="760" y="780" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="38" font-weight="850" text-anchor="middle">REJECT / ROLLBACK</text>
    <text x="1090" y="815" fill="#11736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="27" font-weight="800" text-anchor="middle">CURRENT STATE PRESERVED</text>
  </g>
</svg>
