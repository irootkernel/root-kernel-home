<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Gaori test evidence compression</title>
  <desc id="desc">Gaori preserves a raw test log, processes it with a parser, creates a focused summary, and reports test status separately from extractor status.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#15202b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15202b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <style>
      .title{font:800 46px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
      .flow{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fbf6ed"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <path class="flow" d="M390 330H460"/>
  <path class="flow" d="M700 330H770"/>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="335" height="390" rx="28" fill="#15202b"/>
    <circle cx="96" cy="180" r="8" fill="#ad5428"/>
    <circle cx="124" cy="180" r="8" fill="#11736b"/>
    <circle cx="152" cy="180" r="8" fill="#fffdf8" opacity=".5"/>
    <text class="title" x="222" y="270" fill="#fffdf8">Raw Log</text>
    <path d="M105 350h220m-220 48h172m-172 48h200" stroke="#fffdf8" stroke-opacity=".52" stroke-width="11" stroke-linecap="round"/>
    <path d="M105 494h122" stroke="#ad5428" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="210" width="240" height="240" rx="120" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
    <circle cx="580" cy="302" r="44" fill="#11736b" fill-opacity=".11" stroke="#11736b" stroke-width="4"/>
    <path d="M548 302h64m-45-26l26 26-26 26" fill="none" stroke="#11736b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="title" x="580" y="405" fill="#15202b">Parser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="135" width="375" height="390" rx="28" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <path d="M826 186h112l28 28h123v250H826z" fill="#11736b" fill-opacity=".07" stroke="#11736b" stroke-width="3"/>
    <text class="title" x="957" y="299" fill="#15202b">Summary</text>
    <path d="M870 372h175m-175 43h138m-138 43h194" stroke="#11736b" stroke-opacity=".58" stroke-width="10" stroke-linecap="round"/>
  </g>

  <path d="M580 450v132" fill="none" stroke="#11736b" stroke-width="5" stroke-dasharray="10 12"/>
  <path d="M580 582H310v48M580 582h270v48" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="95" y="630" width="430" height="180" rx="26" fill="#fffdf8" stroke="#ad5428" stroke-width="3"/>
    <circle cx="310" cy="675" r="24" fill="#ad5428"/>
    <path d="M298 675l9 9 17-21" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="783" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="800" fill="#15202b" text-anchor="middle">Test Status</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="675" y="630" width="430" height="180" rx="26" fill="#fffdf8" stroke="#11736b" stroke-width="3"/>
    <circle cx="890" cy="675" r="24" fill="#11736b"/>
    <path d="M878 675l9 9 17-21" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="783" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="36" font-weight="800" fill="#15202b" text-anchor="middle">Extractor Status</text>
  </g>
</svg>
