<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanho keeps documents aligned across repositories in one project</title>
  <desc id="desc">Three repositories belong to one project and exchange document updates around a shared project knowledge center until all documents are in sync.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#15202b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15202b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 3.5L1 8z" fill="#11736b"/>
    </marker>
    <style>
      .repo{font:850 32px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
      .flow{fill:none;stroke:#11736b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fbf6ed"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="365" y="55" width="470" height="145" rx="34" fill="#15202b"/>
    <path d="M405 112h77l17 18h51v45H405z" fill="#11736b" stroke="#fffdf8" stroke-opacity=".55" stroke-width="3"/>
    <text x="705" y="120" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="34" font-weight="850" text-anchor="middle">ONE PROJECT</text>
    <text x="705" y="161" fill="#fffdf8" opacity=".62" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" text-anchor="middle">SHARED KNOWLEDGE</text>
  </g>

  <path d="M600 200v100" fill="none" stroke="#ad5428" stroke-width="6" stroke-linecap="round"/>
  <path class="flow" d="M400 420H355"/>
  <path class="flow" d="M800 420H845"/>
  <path class="flow" d="M600 630V690"/>

  <g filter="url(#shadow)">
    <rect x="400" y="300" width="400" height="330" rx="42" fill="#fffdf8" stroke="#11736b" stroke-width="4"/>
    <circle cx="600" cy="420" r="76" fill="#11736b" fill-opacity=".1" stroke="#11736b" stroke-width="4"/>
    <path d="M558 381h69l18 19v70h-87z" fill="#fffdf8" stroke="#11736b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M627 381v20h18M578 426h47m-47 20h34" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="545" fill="#15202b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="41" font-weight="850" text-anchor="middle">PROJECT DOCS</text>
    <rect x="488" y="568" width="224" height="42" rx="21" fill="#11736b"/>
    <text x="600" y="597" fill="#fffdf8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="23" font-weight="850" letter-spacing="2" text-anchor="middle">IN SYNC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="230" width="300" height="245" rx="30" fill="#fffdf8" stroke="#15202b" stroke-width="3"/>
    <rect x="55" y="230" width="300" height="76" rx="30" fill="#15202b"/>
    <rect x="55" y="278" width="300" height="28" fill="#15202b"/>
    <text class="repo" x="205" y="282" fill="#fffdf8">REPO A</text>
    <path d="M135 340h105l26 26v70H135z" fill="#11736b" fill-opacity=".09" stroke="#11736b" stroke-width="4"/>
    <path d="M240 340v27h26m-100 28h69m-69 21h50" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="288" cy="417" r="22" fill="#ad5428"/>
    <path d="M278 417l8 8 14-18" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="845" y="230" width="300" height="245" rx="30" fill="#fffdf8" stroke="#15202b" stroke-width="3"/>
    <rect x="845" y="230" width="300" height="76" rx="30" fill="#15202b"/>
    <rect x="845" y="278" width="300" height="28" fill="#15202b"/>
    <text class="repo" x="995" y="282" fill="#fffdf8">REPO B</text>
    <path d="M925 340h105l26 26v70H925z" fill="#11736b" fill-opacity=".09" stroke="#11736b" stroke-width="4"/>
    <path d="M1030 340v27h26m-100 28h69m-69 21h50" fill="none" stroke="#11736b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1078" cy="417" r="22" fill="#ad5428"/>
    <path d="M1068 417l8 8 14-18" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="690" width="300" height="165" rx="30" fill="#fffdf8" stroke="#15202b" stroke-width="3"/>
    <rect x="450" y="690" width="300" height="66" rx="30" fill="#15202b"/>
    <rect x="450" y="730" width="300" height="26" fill="#15202b"/>
    <text class="repo" x="600" y="736" fill="#fffdf8">REPO C</text>
    <path d="M535 778h92l20 20h-112z" fill="#11736b" fill-opacity=".12" stroke="#11736b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="678" cy="804" r="21" fill="#ad5428"/>
    <path d="M669 804l7 7 13-16" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
